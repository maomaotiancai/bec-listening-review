<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEC 听力复习库</title><style>:root{--b:#1d4ed8;--i:#172033;--m:#64748b;--l:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:var(--i);font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}.w{max-width:940px;margin:auto;padding:24px 14px 70px}header{color:#fff;background:linear-gradient(135deg,#153b85,#2563eb);padding:25px;border-radius:18px}h1{margin:0;font-size:32px}header p{margin:6px 0 0;color:#dbeafe}.bar,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:18px 0}button,select{font:inherit;padding:8px 11px;border:1px solid var(--l);border-radius:9px;background:#fff;cursor:pointer}button:hover{border-color:var(--b)}.primary{background:var(--b);border-color:var(--b);color:#fff}.card{background:#fff;border:1px solid var(--l);border-radius:14px;margin:15px 0;padding:18px}.card h2{font-size:19px;margin:0 0 6px}.note{background:#eff6ff;border-left:4px solid var(--b)}.en{font-weight:700;font-size:17px}.cn,.meta{color:var(--m);font-size:14px}.hide .cn{display:none}.line{padding:11px 0;border-top:1px solid var(--l)}.line:first-of-type{border:0}.speak{font-size:17px;padding:3px 7px;margin-right:6px}.practice{margin-top:11px;background:#fffbeb;border:1px solid #fde68a;padding:11px;border-radius:9px}.bad{color:#b91c1c}.status{color:var(--m);font-size:14px}@media(max-width:600px){h1{font-size:26px}.w{padding:14px 10px 50px}}</style></head><body><main class="w"><header><h1>BEC 英语听力复习库</h1><p>完整语义理解训练 · 2026-11-23</p></header><div class="bar"><label>课程日期 <select id="date"></select></label><button id="cn">隐藏中文</button><button id="prelim">BEC 初级语速</button><button id="intermediate">BEC 中级语速</button><button class="primary" id="review">复习易错</button><span class="status" id="status"></span></div><section class="card note"><b>练习法：</b>每句先听两次，再用中文说出“谁—做什么—变化/原因—结果”，最后才看中文。🔊 会优先调用设备可用的自然英语语音；它仍是设备语音合成，并非真人录音。</section><section id="summary" class="card"></section><section id="list"></section><p class="meta">完成与易错标记仅保存在此浏览器的本机存储；换设备、清理数据或无痕模式会丢失，不会自动云同步。每天新增课程需编辑网站内容并重新发布到同一 GitHub 仓库。公开站只发布通用学习材料，不发布私人诊断记录。</p></main><script>
const courses={"2026-11-23":{title:"BEC 听力诊断复习 · 17 组",items:[
["会议改期","Good morning, Anna. Is our meeting still at nine tomorrow? Actually, the manager is busy at nine. Can we move it to ten thirty? That's fine. I'll tell the team.","早上好，安娜。明天会议还是九点吗？其实经理九点有事，能改到十点半吗？没问题，我会通知团队。","最终会议改在什么时候？谁来通知团队？"],
["电话改期","Hi, this is Mark from Sales. Can we reschedule the call? I'm free after lunch, around two. Please let me know if that works.","你好，我是销售部的 Mark。能重新安排通话吗？午饭后大约两点我有空。请告诉我是否合适。","谁想改期？建议的新时间是什么？"],
["订单数量","The customer ordered twenty boxes on Monday, but five boxes were damaged. We sent five new boxes on Wednesday, and the customer received them on Friday.","客户周一订了二十箱，但五箱损坏。我们周三补发五箱，客户周五收到。","问题是什么？补发何时到达？"],
["面试时间调整","The interview was planned for Thursday morning, but it is now Thursday afternoon at three.","面试原定周四上午，现在改为周四下午三点。","原时间与新时间分别是什么？"],
["航班延误","Our flight was delayed by two hours, so we arrived at eight thirty in the evening instead of six thirty.","航班延误两小时，因此晚上八点半抵达，而不是六点半。","延误多久？实际抵达时间是何时？"],
["价格表","The supplier said the price list will come by email today, not tomorrow.","供应商说价格表今天通过邮件发来，不是明天。","谁发送什么？何时发送？"],
["报告要求","We don't need the full report today, just a short update by noon. The full report can come next week.","今天不需要完整报告，只要中午前一份简短更新。完整报告下周再交。","今天真正要交的是什么？完整报告何时交？"],
["合同发送","The client asked for the contract before Friday, but we can only send it on Monday morning.","客户要求周五前收到合同，但我们只能周一上午发送。","客户要求与实际计划有什么冲突？"],
["回电话","Please call me back this afternoon, not this morning, because I'm in a meeting until eleven.","请今天下午回电，不要上午，因为我开会到十一点。","为什么不能上午回电？"],
["销售数量","We sold fifteen tickets on Saturday and twenty on Sunday, so weekend sales were thirty-five in total.","周六卖十五张票，周日二十张，周末共三十五张。","周末一共卖了多少？"],
["交付日期","The manager called this morning because the customer wants to change the delivery date.","经理今早来电，因为客户想更改交付日期。","谁打电话？为什么？"],
["发票","The supplier will send the invoice today.","供应商今天会发送发票。","谁会在何时发送什么？"],
["培训地点","The training was going to be in Room 12, but it has been moved to the main conference room.","培训原定在 12 号会议室，现在改到主会议室。","地点发生了什么变化？"],
["预算批准","We cannot start the project until the finance director approves the budget.","财务总监批准预算前，我们不能启动项目。","项目开始的前提是什么？"],
["客户投诉","The customer is unhappy with the late delivery, so we have offered a discount on the next order.","客户不满意延迟交货，因此我们为下一笔订单提供折扣。","客户为何不满？公司如何补救？"],
["展会安排","Let's meet at the exhibition entrance at half past nine and visit the suppliers before lunch.","我们九点半在展会入口见面，午饭前拜访供应商。","在哪里、何时见面？午饭前做什么？"],
["季度目标","Sales are below target this quarter, but the new marketing campaign should improve results next month.","本季度销售低于目标，但新营销活动预计下月改善结果。","目前业绩怎样？下月有何预期？"]]}};
let date="2026-11-23",rate=.82,level="BEC 初级",show=true,store=JSON.parse(localStorage.getItem("bec-v1")||'{"done":{},"bad":{}}');const $=x=>document.querySelector(x),k=i=>date+":"+i,save=()=>{localStorage.setItem("bec-v1",JSON.stringify(store));summary()};function naturalVoice(){let voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)),natural=voices.filter(v=>/(natural|neural|online|aria|jenny|sonia|libby|zira|samantha|google)/i.test(v.name));return natural.find(v=>/en[-_]GB/i.test(v.lang))||natural[0]||voices.find(v=>/en[-_]GB/i.test(v.lang))||voices[0]||null}function say(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t),v=naturalVoice();u.lang=v?v.lang:"en-GB";u.rate=rate;u.pitch=1;u.voice=v;speechSynthesis.speak(u);$("#status").textContent=`${level}语速 · ${v?"优先语音："+v.name:"未发现英语语音，使用浏览器默认语音"}`}function summary(){let a=courses[date].items,n=a.filter((_,i)=>store.done[k(i)]).length,b=a.filter((_,i)=>store.bad[k(i)]).length;$("#summary").innerHTML=`<h2>${courses[date].title}</h2><div class="meta">${a.length} 组材料 · 已完成 ${n} 组 · 易错 ${b} 组</div><div class="actions"><button id="all">本日全部完成</button></div>`;$("#all").onclick=()=>{a.forEach((_,i)=>store.done[k(i)]=true);save();draw()}}function draw(){document.body.classList.toggle("hide",!show);$("#cn").textContent=show?"隐藏中文":"显示中文";$("#prelim").classList.toggle("primary",level==="BEC 初级");$("#intermediate").classList.toggle("primary",level==="BEC 中级");let a=courses[date].items;$("#list").innerHTML=a.map((x,i)=>`<article class="card" id="i${i}"><h2>${i+1}. ${x[0]}</h2><div class="line"><button class="speak" data-s="${i}">🔊</button><span class="en">${x[1]}</span><p class="cn">${x[2]}</p></div><div class="practice"><b>完整语义练习</b><div class="meta">不看中文，先说：${x[3]}</div><details><summary>展开参考中文</summary><div>${x[2]}</div></details><div class="actions"><button data-d="${i}">${store.done[k(i)]?"✓ 已完成":"标记完成"}</button><button class="bad" data-b="${i}">${store.bad[k(i)]?"★ 已标为易错":"标为易错"}</button></div></div></article>`).join("");document.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>say(a[e.dataset.s][1]));document.querySelectorAll("[data-d]").forEach(e=>e.onclick=()=>{let i=e.dataset.d;store.done[k(i)]=!store.done[k(i)];save();draw()});document.querySelectorAll("[data-b]").forEach(e=>e.onclick=()=>{let i=e.dataset.b;store.bad[k(i)]=!store.bad[k(i)];save();draw()});summary()}Object.keys(courses).forEach(d=>$("#date").insertAdjacentHTML("beforeend",`<option value="${d}">${d} · ${courses[d].title}</option>`));$("#date").onchange=e=>{date=e.target.value;draw()};$("#cn").onclick=()=>{show=!show;draw()};$("#prelim").onclick=()=>{rate=.82;level="BEC 初级";draw()};$("#intermediate").onclick=()=>{rate=.98;level="BEC 中级";draw()};$("#review").onclick=()=>{let i=courses[date].items.findIndex((_,n)=>store.bad[k(n)]);if(i<0){$("#status").textContent="还没有易错标记。"}else{$("#i"+i).scrollIntoView({behavior:"smooth"});$("#status").textContent="已跳到第一组易错内容。"}};draw();</script></body></html>
