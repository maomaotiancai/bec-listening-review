好吗？"],["Sure. Is breakfast included?","当然。包含早餐吗？"],["Yes, breakfast is served from seven to ten.","包含，早餐供应时间是七点到十点。"],["Great. Where is the elevator?","太好了。电梯在哪里？"],["It's on your left. Here is your room key.","在您左边。这是您的房卡。"]],"practice":["说明已有预订并出示证件。","确认早餐时间、电梯位置和房卡。"]},{"date":"2026-11-25","title":"去邮局寄包裹","category":"公共服务","vocab":[["package","包裹","I’d like to send this package."],["address","地址","Could you check the address?"],["label","标签；面单","Please put the label on the box."],["weigh","称重","Could you weigh it for me?"],["delivery","递送","How long will delivery take?"],["receipt","收据","Could I have a receipt?"]],"lines":[["Hello. How can I help you?","您好，有什么可以帮您？"],["I’d like to send this package.","我想寄这个包裹。"],["Sure. Is the address on the label correct?","好的。面单上的地址正确吗？"],["Yes, it is. How long will delivery take?","是的。配送需要多长时间？"],["About three days. Would you like a receipt?","大约三天。您需要收据吗？"]],"practice":["跟读 I’d like to send this package，并替换物品。","请工作人员核对地址并称重。","询问配送时间并索要收据。"]}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let moduleName='listening',date='2026-11-23',level='BEC 初级',showChinese=true,filterWrong=false;
let store;try{store=JSON.parse(localStorage.getItem('bec-v1')||'{"done":{},"bad":{}}')}catch{store={done:{},bad:{}}}store.done ||= {};store.bad ||= {};
let player=$('#player'),availableVoices=[];
const listeningDates=Object.keys(courses).sort().reverse();
const dialogueDates=dialogues.map(x=>x.date).sort().reverse();
function key(i){return moduleName==='listening'?date+':'+i:'dialogue:'+date+':'+i}
function save(){localStorage.setItem('bec-v1',JSON.stringify(store))}
function current(){return moduleName==='listening'?courses[date]:dialogues.find(x=>x.date===date)}
function stop(){player.pause();player.removeAttribute('src');player.load();if('speechSynthesis' in window)speechSynthesis.cancel()}
function selectModule(name){stop();moduleName=name;date=(name==='listening'?listeningDates:dialogueDates)[0];filterWrong=false;render()}
function setDate(d){stop();date=d;filterWrong=false;render()}
function setLevel(value){level=value;player.playbackRate=value==='BEC 初级'?.88:1;renderControls()}
function refreshVoices(){if('speechSynthesis' in window)availableVoices=speechSynthesis.getVoices().filter(v=>/^en(?:[-_]|$)/i.test(v.lang)).sort((a,b)=>Number(/natural|neural|online|premium|enhanced/i.test(b.name))-Number(/natural|neural|online|premium|enhanced/i.test(a.name)))}
function say(text){if(!('speechSynthesis' in window)){setStatus('当前浏览器不支持备用语音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text),v=availableVoices[0];u.lang=v?v.lang:'en-GB';u.rate=level==='BEC 初级'?.82:.98;u.pitch=1.05;if(v)u.voice=v;u.onerror=()=>setStatus('备用语音播放失败');speechSynthesis.speak(u);setStatus('备用浏览器语音 · '+level)}
function setStatus(s){$('#status').textContent=s}
function play(src,fallback){stop();player.src=src;player.playbackRate=level==='BEC 初级'?.88:1;player.preservesPitch=true;player.onerror=()=>{player.onerror=null;say(fallback)};player.play().then(()=>setStatus($('#voice').selectedOptions[0].textContent+' · '+level)).catch(()=>say(fallback))}
function playListening(i){let text=current().items[i][1],voice=$('#voice').value;play('audio/'+date+'/'+String(i+1).padStart(2,'0')+'-'+voice+'.mp3',text)}
function playDialogue(){let lesson=current(),voice=$('#voice').value,text=lesson.lines.map(x=>x[0]).join(' ');play('dialogue-audio/'+date+'-'+voice+'.mp3',text)}
function playSentence(text){stop();say(text)}
function mark(kind,i){let k=key(i);store[kind][k]=!store[kind][k];save();render()}
function renderControls(){document.body.classList.toggle('hide-cn',!showChinese);$('#cn').textContent=showChinese?'隐藏中文':'显示中文';$('#prelim').classList.toggle('active',level==='BEC 初级');$('#intermediate').classList.toggle('active',level==='BEC 中级');$('#listening-tab').classList.toggle('active',moduleName==='listening');$('#dialogue-tab').classList.toggle('active',moduleName==='dialogue')}
function render(){renderControls();let dates=moduleName==='listening'?listeningDates:dialogueDates;$('#date').innerHTML=dates.map(d=>'<option value="'+d+'"'+(d===date?' selected':'')+'>'+d+' · '+esc(moduleName==='listening'?courses[d].title:dialogues.find(x=>x.date===d).title)+'</option>').join('');$('#guide').innerHTML=moduleName==='listening'?'<b>听力练习：</b>逐句听两次，先复述“谁、做什么、变化或原因、结果”，再展开中文。每句可用自然语音播放。':'<b>对话练习：</b>先听完整情景对话，再跟读每句，最后不看中文完成口语替换。整段采用预生成英式自然语音；单句及例句使用浏览器备用语音。';if(moduleName==='listening')renderListening();else renderDialogue()}
function renderListening(){let a=current().items,done=a.filter((_,i)=>store.done[key(i)]).length,bad=a.filter((_,i)=>store.bad[key(i)]).length;$('#summary').innerHTML='<h2>'+esc(current().title)+'</h2><div class="meta">'+a.length+' 组 · 已完成 '+done+' 组 · 易错 '+bad+' 组</div><div class="actions"><button id="wrong">'+(filterWrong?'显示全部':'只看易错')+'</button></div>';$('#wrong').onclick=()=>{filterWrong=!filterWrong;render()};$('#list').innerHTML=a.map((x,i)=>filterWrong&&!store.bad[key(i)]?'':'<article class="card"><h2>'+(i+1)+'. '+esc(x[0])+'</h2><div class="line row"><button class="speak" data-listen="'+i+'" aria-label="播放第'+(i+1)+'组">🔊</button><div class="words"><div class="en">'+esc(x[1])+'</div><div class="cn">'+esc(x[2])+'</div></div></div><div class="practice"><b>完整语义练习</b><div>'+esc(x[3])+'</div><details><summary>展开参考中文</summary>'+esc(x[2])+'</details><div class="actions"><button data-d="'+i+'">'+(store.done[key(i)]?'✓ 已完成':'标记完成')+'</button><button class="bad" data-b="'+i+'">'+(store.bad[key(i)]?'★ 已标为易错':'标为易错')+'</button></div></div></article>').join('')||'<section class="card">本日还没有易错标记。</section>';document.querySelectorAll('[data-listen]').forEach(e=>e.onclick=()=>playListening(Number(e.dataset.listen)));bindMarks()}
function renderDialogue(){let lesson=current(),k=key(0),v=lesson.vocab,l=lesson.lines;$('#summary').innerHTML='<h2>'+esc(lesson.date+' · '+lesson.title)+'</h2><span class="label">'+esc(lesson.category)+'</span><div class="meta">'+v.length+' 个实用表达 · '+l.length+' 句对话 · 口语任务 '+lesson.practice.length+' 项</div><div class="actions"><button id="whole" class="primary">🔊 朗读整段对话</button><button data-d="0">'+(store.done[k]?'✓ 今日已完成':'标记今日完成')+'</button><button class="bad" data-b="0">'+(store.bad[k]?'★ 已标为易错':'标为易错')+'</button></div>';$('#whole').onclick=playDialogue;$('#list').innerHTML='<section class="card"><h2>实用词汇与例句</h2>'+v.map((x,i)=>'<div class="line row"><button class="speak" data-say="'+esc(x[2])+'" aria-label="朗读例句">🔊</button><div class="words"><b>'+esc(x[0])+'</b> <span class="cn">'+esc(x[1])+'</span><div class="en">'+esc(x[2])+'</div></div></div>').join('')+'</section><section class="card"><h2>情景对话</h2>'+l.map((x,i)=>'<div class="line row"><button class="speak" data-say="'+esc(x[0])+'" aria-label="朗读第'+(i+1)+'句">🔊</button><div class="words"><div class="en">'+esc(x[0])+'</div><div class="cn">'+esc(x[1])+'</div></div></div>').join('')+'</section><section class="card"><h2>口语表达训练</h2><ol>'+lesson.practice.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><div class="practice"><b>完成方法：</b>先听整段，再逐句跟读，最后尝试用自己的信息完成上面的任务。</div></section>';document.querySelectorAll('[data-say]').forEach(e=>e.onclick=()=>playSentence(e.dataset.say));bindMarks()}
function bindMarks(){document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>mark('done',Number(e.dataset.d)));document.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>mark('bad',Number(e.dataset.b)))}
$('#listening-tab').onclick=()=>selectModule('listening');$('#dialogue-tab').onclick=()=>selectModule('dialogue');$('#date').onchange=e=>setDate(e.target.value);$('#cn').onclick=()=>{showChinese=!showChinese;renderControls()};$('#prelim').onclick=()=>setLevel('BEC 初级');$('#intermediate').onclick=()=>setLevel('BEC 中级');$('#voice').onchange=()=>{localStorage.setItem('bec-voice-v2',$('#voice').value);setStatus('已选择 '+$('#voice').selectedOptions[0].textContent)};let saved=localStorage.getItem('bec-voice-v2');if(saved==='sonia'||saved==='ryan')$('#voice').value=saved;refreshVoices();if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=refreshVoices;render();
</script><script>
const extraTags=['词汇','句型','时间表达','长句理解','连读弱读'];
let speedOverride=null,repeatOn=false,displayMode='both';
const oldPlay=play;play=function(src,fallback){oldPlay(src,fallback);if(speedOverride!==null)player.playbackRate=speedOverride;player.loop=repeatOn};
const oldSay=say;say=function(t){if(!('speechSynthesis' in window)){setStatus('当前浏览器不支持备用语音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t),v=availableVoices[0];u.lang=v?v.lang:'en-GB';u.rate=speedOverride??(level==='BEC 初级'?.82:.98);u.pitch=1.05;if(v)u.voice=v;u.onerror=()=>setStatus('备用语音播放失败');speechSynthesis.speak(u);setStatus('浏览器合成语音 · '+u.rate.toFixed(2)+'×')}; 
function tagsFor(text){let tags=[];if(/\b(at|on|in|before|after|tomorrow|yesterday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|o'clock|hour|minute|seven|nine|ten|thirty)\b/i.test(text))tags.push('时间表达');if(text.length>105)tags.push('长句理解');if(/\b(would|could|can|if|until|because|instead|should)\b/i.test(text))tags.push('句型');if(/\b(to|for|of|a|an|the)\b/i.test(text))tags.push('连读弱读');tags.push('词汇');return [...new Set(tags)]}
function records(){let out=[];for(let [d,c] of Object.entries(courses))c.items.forEach((x,i)=>out.push({module:'listening',date:d,title:x[0],theme:'商务听力',text:x[1],cn:x[2],tags:tagsFor(x[1]),index:i}));dialogues.forEach(c=>out.push({module:'dialogue',date:c.date,title:c.title,theme:c.category,text:c.lines.map(x=>x[0]).join(' '),cn:c.lines.map(x=>x[1]).join(' '),tags:tagsFor(c.lines.map(x=>x[0]).join(' ')),index:0}));return out}
function refreshSearch(){let all=records(),word=$('#search-word').value.trim().toLowerCase(),mod=$('#search-module').value,d=$('#search-date').value,theme=$('#search-theme').value,tag=$('#search-tag').value;let hit=all.filter(x=>(mod==='all'||x.module===mod)&&(d==='all'||x.date===d)&&(theme==='all'||x.theme===theme)&&(tag==='all'||x.tags.includes(tag))&&(!word||(x.title+x.text+x.cn+x.theme).toLowerCase().includes(word)));$('#search-results').innerHTML='<b>找到 '+hit.length+' 项</b>'+hit.map(x=>'<button class="search-hit" data-module="'+x.module+'" data-date="'+x.date+'" data-index="'+x.index+'">'+(x.module==='listening'?'🎧':'💬')+' '+x.date+' · '+esc(x.title)+' · '+esc(x.theme)+' '+x.tags.map(t=>'<span class="pill">'+t+'</span>').join('')+'</button>').join('');document.querySelectorAll('.search-hit').forEach(b=>b.onclick=()=>{selectModule(b.dataset.module);setDate(b.dataset.date);document.querySelector('#list')?.scrollIntoView({behavior:'smooth'});if(b.dataset.module==='listening')document.querySelectorAll('#list article')[Number(b.dataset.index)]?.scrollIntoView({behavior:'smooth'})})}
let allRecords=records();[...new Set(allRecords.map(x=>x.date))].sort().reverse().forEach(d=>$('#search-date').insertAdjacentHTML('beforeend','<option>'+d+'</option>'));[...new Set(allRecords.map(x=>x.theme))].sort().forEach(t=>$('#search-theme').insertAdjacentHTML('beforeend','<option>'+esc(t)+'</option>'));document.querySelectorAll('#search-panel input,#search-panel select').forEach(e=>e.addEventListener('input',refreshSearch));refreshSearch();
function material(){let c=current();return moduleName==='listening'?c.items.map((x,i)=>(i+1)+'. '+x[0]+'\n'+x[1]+'\n'+x[2]).join('\n\n'):c.date+' '+c.title+'\n词汇：\n'+c.vocab.map(x=>x.join(' / ')).join('\n')+'\n对话：\n'+c.lines.map(x=>x.join(' / ')).join('\n')+'\n口语任务：\n'+c.practice.join('\n')}
function download(name,text){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const privateKey='bec-private-progress-v1';function privateData(){try{return JSON.parse(localStorage.getItem(privateKey)||'{}')}catch{return {}}}function privateSave(x){localStorage.setItem(privateKey,JSON.stringify(x))}function lessonKey(){return moduleName+':'+date}function updatePrivate(){let x=privateData()[lessonKey()]||{};$('#mastery').value=x.mastery||'new';$('#review-status').textContent='已复习 '+(x.count||0)+' 次'}
$('#review-count').onclick=()=>{let x=privateData();x[lessonKey()] ||= {};x[lessonKey()].count=(x[lessonKey()].count||0)+1;privateSave(x);updatePrivate()};$('#mastery').onchange=()=>{let x=privateData();x[lessonKey()] ||= {};x[lessonKey()].mastery=$('#mastery').value;privateSave(x);updatePrivate()};$('#export-backup').onclick=()=>download('bec-local-backup.json',JSON.stringify({version:1,progress:store,private:privateData()},null,2));$('#import-backup').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(x.version!==1||!x.progress||!x.private)throw Error('格式不正确');store=x.progress;save();privateSave(x.private);render();updatePrivate();alert('本机记录已导入')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};$('#copy-material').onclick=async()=>{await navigator.clipboard.writeText(material());setStatus('本课通用教材已复制')};$('#export-material').onclick=()=>download('bec-public-materials.json',JSON.stringify({listening:courses,dialogue:dialogues},null,2));
$('#repeat').onclick=()=>{repeatOn=!repeatOn;player.loop=repeatOn;$('#repeat').textContent='重复播放：'+(repeatOn?'开':'关')};$('#speed').oninput=e=>{speedOverride=Number(e.target.value);player.playbackRate=speedOverride;$('#speed-value').textContent=speedOverride.toFixed(2)+'×'};$('#bilingual').onclick=()=>{displayMode=displayMode==='both'?'english':displayMode==='english'?'chinese':'both';showChinese=true;renderControls();document.querySelectorAll('.en').forEach(e=>e.style.display=displayMode==='chinese'?'none':'');document.querySelectorAll('.cn').forEach(e=>e.style.display=displayMode==='english'?'none':'');$('#bilingual').textContent=displayMode==='both'?'中英对照':displayMode==='english'?'只看英文':'只看中文'};
const baseRender=render;render=function(){baseRender();updatePrivate();refreshSearch();document.querySelectorAll('.line .en').forEach(el=>{let text=el.textContent;if(text.length<45)return;let parts=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)?.map(x=>x.trim()).filter(Boolean)||[];if(parts.length<2)return;let box=document.createElement('div');box.className='meta';box.innerHTML='<b>分块跟读（浏览器合成语音）</b> '+parts.map((p,i)=>'<button data-chunk="'+i+'">'+(i+1)+'. '+esc(p)+'</button>').join('');el.after(box);box.querySelectorAll('[data-chunk]').forEach((b,i)=>b.onclick=()=>playSentence(parts[i]))})};updatePrivate();render();
</script></body></html>
